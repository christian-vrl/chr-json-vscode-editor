# Benchmarks on the GitHub Actions runner. Each job writes its report, shows it in the run summary
# and the log, and uploads it with the raw results; the committed copies come from such runs.
# - vscode-open (003 T11, evidence for UNK-014): open, first render and one edit at 1, 5, 10 and
#   50 MiB, end to end in VS Code's custom editor webview; bench/vscode-open.md.
# - core (002 T8, spec 002 criterion 7): core parse and one edit per format at 1, 10, 50 MiB, and
#   (011 T5, spec 011 criterion 12) the JavaScript and Lodash bench queries at 1 and 5 MiB in the
#   query engine beside the library's reference, and (014 T4, spec 014 criterion 10) the JSONPath
#   bench queries in RFC 9535 beside Goessner at 1 and 5 MiB; bench/RESULTS.md.
# - compare (007 T5, evidence for UNK-037): structural compare at 1, 5, 10 and 50 MiB, in core and
#   end to end in VS Code's compare panel (open, one live refresh); bench/compare.md.
# - large-file (008 T5, spec 008 criterion 11, evidence for UNK-041): large-file mode for JSON, JSONC
#   and JSON5 at 6, 10 and 50 MiB (open, host busy time, one validation, heap, one unlocked edit at
#   50 MiB); bench/large-file.md.
# Not part of ci.yml: they take minutes and measure, they do not gate. Run on demand and on pull
# requests that change the benchmarks.
name: bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bench/**'
      - '.github/workflows/bench.yml'

permissions:
  contents: read

# The reports name the commit measured: a pull request's head, not GitHub's merge ref (GITHUB_SHA).
env:
  BENCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-open:
    name: open, render, edit at 1/5/10/50 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: pnpm build
      # The e2e .vsix: the release build plus test hooks.
      - run: CHR_TEST_HOOKS=1 pnpm package
      # VS Code stable is downloaded by @vscode/test-electron, as in ci.yml's e2e job.
      - run: xvfb-run -a pnpm --filter @chr-json-editor/bench bench
      # Also printed to the log, so the report and its raw results can be read without the artifact.
      - name: Report in the run summary and the log
        run: |
          cat bench/vscode-open.md >> "$GITHUB_STEP_SUMMARY"
          cat bench/vscode-open.md bench/.results/vscode.json bench/.results/vscode-second.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-vscode-open
          path: |
            bench/vscode-open.md
            bench/.results/*.json
          include-hidden-files: true
          if-no-files-found: error

  core:
    name: core parse and one edit at 1/10/50 MiB, queries at 1/5 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Spec 015 criterion 11: the base commit's core, built in this job, measured at 10 MiB.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bench-base
      - name: Build the base commit's core
        if: github.event_name == 'pull_request'
        working-directory: .bench-base
        run: |
          pnpm install --frozen-lockfile --filter @chr-json-editor/core...
          pnpm --filter @chr-json-editor/core build
      - run: pnpm --filter @chr-json-editor/core build
      - run: pnpm --filter @chr-json-editor/bench bench:core
      - name: Measure the base commit's core
        if: github.event_name == 'pull_request'
        env:
          BENCH_CORE: .bench-base/packages/core/dist/index.js
          BENCH_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: node bench/core/run.mjs bench/.results/core-base.json 10
      # Rewritten with the base commit's cells, in a step of its own so the report names this
      # commit (BENCH_COMMIT from the workflow env), not the base.
      - name: Report against the base commit
        if: github.event_name == 'pull_request'
        run: node bench/core/report.mjs bench/.results/core.json bench/RESULTS.md bench/.results/query.json bench/.results/core-base.json
      - name: Report in the run summary and the log
        run: |
          cat bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          cat bench/RESULTS.md bench/.results/core*.json bench/.results/query.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-core
          path: |
            bench/RESULTS.md
            bench/.results/core*.json
            bench/.results/query.json
          include-hidden-files: true
          if-no-files-found: error

  compare:
    name: compare at 1/5/10/50 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: pnpm build
      # The e2e .vsix: the release build plus test hooks.
      - run: CHR_TEST_HOOKS=1 pnpm package
      - run: xvfb-run -a pnpm --filter @chr-json-editor/bench bench:compare
      - name: Report in the run summary and the log
        run: |
          cat bench/compare.md >> "$GITHUB_STEP_SUMMARY"
          cat bench/compare.md bench/.results/compare-core.json bench/.results/compare-vscode.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-compare
          path: |
            bench/compare.md
            bench/.results/compare-*.json
          include-hidden-files: true
          if-no-files-found: error

  large-file:
    name: large-file mode, JSON/JSONC/JSON5 at 6/10/50 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: pnpm build
      # The e2e .vsix: the release build plus test hooks.
      - run: CHR_TEST_HOOKS=1 pnpm package
      - run: xvfb-run -a pnpm --filter @chr-json-editor/bench bench:large-file
      - name: Report in the run summary and the log
        run: |
          cat bench/large-file.md >> "$GITHUB_STEP_SUMMARY"
          cat bench/large-file.md bench/.results/large-file.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-large-file
          path: |
            bench/large-file.md
            bench/.results/large-file.json
          include-hidden-files: true
          if-no-files-found: error
