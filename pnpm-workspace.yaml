packages:
  - packages/*
  - spikes/*
  - bench

# Install scripts we deliberately skip: esbuild finds its binary through its optional
# platform package, and @vscode/vsce-sign is only used for signing, which `pnpm package` does not do.
# keytar (through ovsx) stores tokens in the OS keychain; the release job passes OVSX_PAT instead.
# @playwright/browser-chromium (through @vscode/test-web, 013 T1) downloads Chromium; CI installs it
# with `playwright install`, and cloud sandboxes already have one.
ignoredBuiltDependencies:
  - '@playwright/browser-chromium'
  - '@vscode/vsce-sign'
  - esbuild
  - keytar
