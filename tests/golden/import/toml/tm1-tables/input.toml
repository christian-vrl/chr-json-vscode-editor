# A manifest with tables, inline tables and strings. Comments are not carried.
title = "TOML example"
'literal key' = 'C:\Users\path'
"quoted.key" = "dotted inside quotes"
site.name = "dotted"
site.port = 8080

[package]
name = "demo"
version = "0.1.0"
authors = ["A <a@example.com>", "B"]
description = """
Multi-line
basic string"""
raw = '''
No \escapes here'''

[dependencies]
serde = { version = "1.0", features = ["derive"] }
inline-empty = {}

[server.http]
enabled = true

[server]
host = "localhost"

[mixed]
array = [1, "two", 3.0, [4], { five = 5 }]
empty = []
