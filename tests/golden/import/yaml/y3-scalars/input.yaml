# Scalars of every core-schema kind (Y3); comments are not carried (A6).
plain: hello world   # a trailing comment
single: 'it''s'
double: "tab\there é \"q\""
literal: |
  line one
  line two
folded: >
  folded
  text

  new paragraph
strip: |-
  no final newline
nulls: [null, Null, NULL, ~]
empty:
booleans: [true, True, TRUE, false, False, FALSE]
not-booleans: [yes, no, on, off, y, n]
ints: [0, 42, -17, 0o17, 0x1F, +12]
floats: [1.5, -2.25, .5, 5., +1.5, 1e2, 1.0]
quoted-number: "42"
